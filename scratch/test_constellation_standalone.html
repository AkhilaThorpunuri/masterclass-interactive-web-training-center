
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { background: #0f172a; margin: 0; padding: 40px; font-family: sans-serif; color: #fff; }
  .ai-word-cloud-card {
    background: #0f172a;
    border: 1px solid #334155;
    border-radius: 16px;
    padding: 24px;
    max-width: 960px;
    margin: 0 auto;
  }
  .word-cloud-sphere-wrapper {
    position: relative;
    width: 100%;
    height: 440px;
    border-radius: 14px;
    overflow: hidden;
    background: radial-gradient(ellipse at 50% 50%, #1e1b4b 0%, #090d16 100%);
    border: 1px solid rgba(139, 92, 246, 0.35);
  }
  .word-cloud-sphere-stage {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 0;
    height: 0;
    transform-style: preserve-3d;
  }
  .cloud-3d-tag {
    position: absolute;
    top: 0;
    left: 0;
    transform: translate(-50%, -50%);
    padding: 5px 12px;
    border-radius: 999px;
    font-size: 0.8rem;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
    border: 1px solid rgba(255,255,255,0.25);
    background: rgba(15, 23, 42, 0.85);
    color: #e2e8f0;
  }
  .tag-cat-llm { border-color: #a855f7; color: #d8b4fe; background: rgba(88, 28, 135, 0.7); }
  .tag-cat-rag { border-color: #38bdf8; color: #7dd3fc; background: rgba(3, 105, 161, 0.7); }
  .tag-cat-agent { border-color: #34d399; color: #a7f3d0; background: rgba(6, 95, 70, 0.7); }
  .tag-cat-tuning { border-color: #fbbf24; color: #fde68a; background: rgba(146, 64, 14, 0.7); }
</style>
</head>
<body>
<div class="ai-word-cloud-card">
  <h2>3D Interactive AI Buzzwords & Terms Constellation</h2>
  <div class="word-cloud-sphere-wrapper" id="sphereWrapper">
    <div class="word-cloud-sphere-stage" id="wordCloudStage"></div>
  </div>
</div>
<script>
  const stage = document.getElementById("wordCloudStage");
  const words = [
    { text: "LLM", cat: "llm" }, { text: "Transformer", cat: "llm" }, { text: "Tokens", cat: "llm" },
    { text: "Context Window", cat: "llm" }, { text: "Temperature", cat: "llm" }, { text: "System Prompt", cat: "llm" },
    { text: "Zero-Shot vs Few-Shot", cat: "llm" }, { text: "Multimodal", cat: "llm" }, { text: "Inference", cat: "llm" },
    { text: "Latency & TTFT", cat: "llm" }, { text: "RAG", cat: "rag" }, { text: "Vector Embeddings", cat: "rag" },
    { text: "Vector DB", cat: "rag" }, { text: "Semantic Search", cat: "rag" }, { text: "Chunking", cat: "rag" },
    { text: "Reranker", cat: "rag" }, { text: "Cosine Similarity", cat: "rag" }, { text: "Agents", cat: "agent" },
    { text: "MCP Protocol", cat: "agent" }, { text: "ReAct Loops", cat: "agent" }, { text: "AI Harness", cat: "agent" },
    { text: "Tool Calling", cat: "agent" }, { text: "Multi-Agent Swarm", cat: "agent" }, { text: "Fine-Tuning", cat: "tuning" },
    { text: "LoRA", cat: "tuning" }, { text: "Evaluators", cat: "tuning" }, { text: "Guardrails", cat: "tuning" },
    { text: "Hallucination", cat: "tuning" }, { text: "Chain-of-Thought", cat: "tuning" }, { text: "Quantization", cat: "tuning" }
  ];

  const tags = words.map(w => {
    const btn = document.createElement("button");
    btn.className = "cloud-3d-tag tag-cat-" + w.cat;
    btn.textContent = w.text;
    stage.appendChild(btn);
    return btn;
  });

  const count = tags.length;
  const radiusX = 380;
  const radiusY = 135;
  const radiusZ = 240;

  // Horizontal orbital galaxy: 3 elevation tiers with wide horizontal radius
  const points = tags.map((el, i) => {
    const tier = i % 3; // 0=top, 1=mid, 2=bottom
    const tierY = (tier === 0 ? -1 : (tier === 1 ? 0 : 1)) * radiusY * 0.75;
    const tierRadius = radiusX * (tier === 1 ? 1.0 : 0.88);
    const angle = (Math.floor(i / 3) / Math.ceil(count / 3)) * 2 * Math.PI + (tier * 0.65);

    return {
      el: el,
      angle: angle,
      tierY: tierY,
      tierRadius: tierRadius
    };
  });

  let currentRotY = 0;
  const tiltX = 0.22; // 12 deg tilt towards user
  const cosTilt = Math.cos(tiltX);
  const sinTilt = Math.sin(tiltX);

  function frame() {
    currentRotY += 0.004;

    const perspective = 500;
    points.forEach(p => {
      const a = p.angle + currentRotY;
      // Orbit in horizontal plane
      const rawX = Math.cos(a) * p.tierRadius;
      const rawZ = Math.sin(a) * (radiusZ * (p.tierRadius / radiusX));
      const rawY = p.tierY;

      // Apply fixed pleasant forward tilt so you see both front and back
      const y = rawY * cosTilt - rawZ * sinTilt;
      const z = rawZ * cosTilt + rawY * sinTilt;
      const x = rawX;

      const scale = perspective / (perspective - z);
      const screenX = Math.round(x * scale);
      const screenY = Math.round(y * scale);
      const normZ = (z + radiusZ) / (2 * radiusZ);
      const alpha = Math.max(0.35, Math.min(1.0, 0.45 + 0.55 * normZ));

      p.el.style.transform = "translate3d(" + screenX + "px, " + screenY + "px, 0) translate(-50%, -50%) scale(" + scale.toFixed(3) + ")";
      p.el.style.opacity = alpha.toFixed(2);
      p.el.style.zIndex = Math.round(z + 500);
    });

    requestAnimationFrame(frame);
  }
  frame();
</script>
</body>
</html>
